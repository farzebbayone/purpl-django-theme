[tool.poetry]
name = "purpl-django-theme"
version = "0.1.0"
description = "Bootstrap 5 Django theme repainted with Bayone's Purpl design tokens"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
markdown = "^3.10.2"

[tool.poetry.group.dev.dependencies]
django-browser-reload = "^1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
